# ============================================================
#  Argus MC — Plugin Anti-Cheat + Screen Share
#  https://argusprojects.com
# ============================================================
#
# Como obtener tu API key:
#   1. Entra al panel super-admin: https://asperss.onrender.com/aspers-sa
#   2. Baja a la seccion "Plugin Keys Minecraft" y crea una nueva.
#   3. La key SE MUESTRA UNA SOLA VEZ. Guardala aqui inmediatamente.
#   4. Recarga el plugin con  /argus reload
#
# Si necesitas otra clave porque perdiste la anterior, revoca la
# vieja desde el panel y crea otra. Nunca compartas esta clave.

api:
  # URL base de tu instancia de Argus. Por defecto la oficial.
  base_url: "https://asperss.onrender.com"

  # Tu API key (la que recibiste al crearla en el panel).
  # IMPORTANTE: pega la clave completa con el prefijo `argus_pk_`.
  key: "REEMPLAZA_AQUI_TU_API_KEY"

  # Timeout en segundos para las llamadas HTTP.
  timeout_seconds: 12

# ── Comportamiento del comando /argus check ───────────────────
# (anteriormente /ss — renombrado para no chocar con plugins de
#  freeze que usan /ss. Aliases del subcomando: ss, screenshare,
#  scan. Ej: /argus check Pepe hablando raro)
ss:
  # Si true, el target tambien recibe el codigo y la URL en chat
  # privado. Si false, solo el staff que ejecuto /argus check lo ve.
  notify_target: true

  # Tiempo (en minutos) que el plugin recordara al staff en
  # broadcast/log que hay un SS pendiente para target X. Solo
  # afecta al log local; el token expira segun lo defina la web.
  remind_window_minutes: 30

  # Si true, los anuncios "X esta haciendo SS a Y" se envian a
  # todos los staff con el permiso 'argus.ss.notify'.
  broadcast_to_staff: true

  # Si true, exige una razon para todos los SS manuales.
  require_reason: false

  # Numero minimo de chars de la razon cuando se exige.
  min_reason_length: 4

# ── ANTI-CHEAT ────────────────────────────────────────────────
# Detecta cheats por comportamiento. Cada check produce
# "violations" con un nivel (LOW / MID / HIGH / CRITICAL).
#
# Reglas globales del manager (umbral acumulado por minuto):
#   - LOW:      solo log + alerta in-game al staff con argus.alerts.
#   - MID:      kick automatico con razon legible + alerta + Discord.
#   - HIGH:     kick + auto-emision de SS forzado al volver + Discord.
#   - CRITICAL: ban temporal (configurable abajo) + alerta urgente.
#
# Los jugadores con permiso 'argus.ac.bypass' nunca acumulan
# violations (util para staff/owners en modo creative volando).
anticheat:
  enabled: true

  # Si false, el plugin solo loguea sin kickear/banear (modo observador
  # ideal para los primeros dias en un server nuevo, mientras ajustas
  # thresholds si tienes muchos falsos positivos).
  enforcement: true

  # Acciones por nivel ACUMULADO de violations en la ventana abajo.
  # Defaults Pack 44.2: tolerantes para evitar false-positives. Si tu
  # server es PvP estricto (sin lag, sin clientes 1.8 raros), bajalos.
  thresholds:
    low_alert_at:    3   # 3 LOWs distintas para alertar a staff
    mid_kick_at:     3   # 3 MID acumulados = kick (1 mid solo NO kickea)
    high_force_ss:   2   # 2 HIGH acumulados = kick + auto-SS al volver
    critical_ban_at: 2   # 2 CRITICAL acumulados = ban temporal

  # Duracion del ban temporal en CRITICAL (en minutos).
  critical_ban_minutes: 60

  # Acumulador resetea cada N segundos (sliding window). Si subes esto,
  # el AC tiene "memoria mas larga" y un cheater intermitente se cae.
  violation_window_seconds: 90

  # Manda violations al backend para que aparezcan en el panel.
  # Requiere api.key valida.
  report_to_backend: true

  # Opcional: webhook de Discord para alertas HIGH y CRITICAL.
  # Dejar vacio para deshabilitar.
  discord_webhook_url: ""

  # ── Argus AI Oracle (Pack 44) ──────────────────────────────────────
  # Cada violation se manda al backend Argus para que el Oracle (IA
  # heuristica humanizada) evalue al jugador con TODA su evidencia
  # (violations + historial de SS + metadata). Si la IA decide una
  # accion MAS severa que la del ViolationManager local, la aplicamos
  # automaticamente (kick, SS forzado, ban temporal). El staff con
  # permiso 'argus.alerts' recibe el reasoning humanizado en chat.
  #
  # Apaga esto si tu server no quiere depender del backend o si vas a
  # operar 100% offline.
  ai_oracle_enabled: true

  # Permite desactivar checks individualmente o ajustar sus
  # umbrales por defecto. Cualquier check no listado usa sus
  # defaults internos.
  checks:
    reach:
      enabled: true
      max_distance: 4.5      # 4.5b vainilla 1.8 PvP. Compensa ping automaticamente
                             # (hasta +1.5b extra para players con ping >100ms).
    killaura_angle:
      enabled: true
      max_angle_deg: 90      # solo flag si miras a 90+deg del target. Fast turn
                             # legitimo en PvP llega facil a 60-80deg.
                             # Solo aplica a hits melee.
    killaura_multi:
      enabled: true
      window_ms: 250
      min_distinct_targets: 4 # 4 targets en 250ms es bot. Sweep enchant vainilla
                              # NO cuenta (event distinto). Skip si target es item/etc.
    killaura_yaw_snap:
      enabled: true
      max_delta_deg: 130     # subido a 130deg + check de mis-alignment (solo flag
      max_age_ms: 200        # si despues del snap NO esta mirando al target).
    killaura_no_swing:
      enabled: true
      max_swing_age_ms: 600  # 600ms tolera ViaVersion lag. Skipea primer hit del
                             # jugador y sweep collateral.
    hit_through_wall:
      enabled: true          # ray-trace + whitelist de bloques parciales
                             # (stairs, slabs, fences, glass, doors, leaves, etc.)
    autoclicker:
      enabled: true
      max_cps: 22            # 20 era ajustado para butterfly clickers humanos
      variance_min_cps: 12   # solo medir varianza si CPS alto (humano regular puede
                             # sostener 8-10 cps)
      min_stddev_ms: 25.0    # 25ms — humanos tipicos miden 30-80ms stddev
      min_samples: 12        # mas muestras para ser estadisticamente significativo
    fly:
      enabled: true
      # HOVER REAL = Y casi constante (|dy| < 0.15 b/s). Saltos, parkour y
      # caidas NO cuentan como hover. Para flagear necesita acumular este
      # numero de segundos consecutivos de hover real.
      max_hover_seconds: 4
      # Doble candado: ademas de hover real, debe llevar este numero de
      # segundos en el aire sin tocar piso. Saltos vainilla nunca pasan
      # de ~1.5s sin tocar suelo, asi que 5s es muy seguro.
      min_air_seconds_before_flag: 5
    speed:
      enabled: true
      max_blocks_per_sec: 10.0  # whitelist completa: speed potion (+4),
                                # elytra (+30), vehicle (+20), ice variants
                                # (+10/+15/+40), slime block (skip).
    scaffold:
      enabled: true
      min_pitch_deg: 70      # solo flag si mira casi recto al suelo
      window_ms: 2000        # ventana de 2s
      min_hits: 6            # 6 placements en aire suspendido en 2s
    nofall:
      enabled: true          # delayed task 4-tick + whitelist (water, slime,
                             # hay, honey, cobweb, scaffolding, ladder, vines,
                             # powder snow, kelp, slow falling, levitation,
                             # gliding, vehicle).
    jesus:
      enabled: true          # whitelist: lily pad, frost walker enchant,
                             # ice blocks, bubble columns, vehicles. Threshold
                             # subido a 8 ticks para evitar transitorios.
    fasteat:
      enabled: true
      min_eat_ms: 1200       # whitelist: buckets, potions (drink time legitimo).
    chat_spam:
      enabled: true
      max_msgs_per_5s: 7     # subido para conversaciones intensas legitimas
    cmd_spam:
      enabled: true
      max_cmds_per_5s: 12    # subido + whitelist /msg /r /spawn /home /argus*
    inventory_move:
      enabled: true          # threshold subido a 5b/300ms (era 2b/500ms);
                             # PvP legitimo en 1.8 con fast pearl no triggers.

    # ── Pack 47: checks PACKET-BASED (requieren PacketEvents instalado) ────
    # Solo se activan si el plugin PacketEvents esta presente. Si no,
    # ArgusMC sigue con los checks Bukkit-based de arriba.
    timer:
      enabled: true          # detecta TimerHack midiendo el intervalo real
                             # entre PlayerPosition packets (50ms vanilla).
    phase:
      enabled: true          # NoClip por raycast entre packets de movimiento.
                             # Whitelist conservadora de bloques solidos.
    velocity:
      enabled: true          # AntiKnockback: cliente debe respetar la velocity
                             # asignada por el server (umbral 30%).
    invalid_rotation:
      enabled: true          # pitch fuera de [-90,+90] o yaw NaN = cliente
                             # modificado garantizado.
    reach_packet:
      enabled: true          # reach con posicion EXACTA en el tick del hit.
    killaura_swing_packet:
      enabled: true          # attack sin Animation packet previo en 250ms.
    aim_snap_packet:
      enabled: true          # delta yaw >80° entre packets + attack en 200ms.
    ping_spoof:
      enabled: true          # RTT <3ms (imposible) o >5000ms sostenido.
    cps_packet:
      enabled: true          # CPS real (>22 LOW, >30 MID, >45 HIGH).
    inv_move_packet:
      enabled: true          # ClickWindow durante movimiento legitimo.

    # ── Pack 48: nuevos checks PACKET-BASED (Bloque 2 — movement/blocks) ─────
    vclip:
      enabled: true          # delta Y impossible en un solo packet (>0.65b sin
                             # jump boost, >1.20b incluso con). Whitelist completa:
                             # creative/flying, spectator, vehicle, elytra, swim,
                             # levitation, slow falling. Compensa jump boost.
      dy_mid: 0.65
      dy_high: 1.20
      dy_critical: 2.00

# ── Mensajes (puedes traducir libremente) ─────────────────────
messages:
  prefix: "&8[&6Argus&8]&r "

  no_permission: "&cNo tienes permiso para usar este comando."
  player_not_found: "&cNo se encontro al jugador &f{player}&c en el servidor."
  player_is_bypassed: "&cEse jugador esta exento de Screen Share (permiso argus.ss.bypass)."
  cannot_target_self: "&cNo puedes hacerte SS a ti mismo."
  reason_too_short: "&cLa razon es obligatoria y debe tener al menos {min} caracteres."
  api_misconfigured: "&cEl plugin no esta configurado. Avisa a un admin (config.yml > api.key)."
  api_error: "&cError contactando a Argus: &f{error}&c. Reintenta en unos segundos."

  ss_issued_staff: |
    &7&m──────────────────────────────────────────&r
    &6&l[ ARGUS SS ]&r &7Codigo emitido para &e{target}&7:
    &fCodigo: &e&l{code}    &7Expira en: &c30 min
    &7Descarga: &b{download}
    &7Si el target no descarga en 30 min, repite /argus check.
    &7&m──────────────────────────────────────────&r
  ss_issued_target: |
    &7&m──────────────────────────────────────────&r
    &6&l[ ARGUS SS ]&r &7El staff &e{staff}&7 te pidio un Screen Share.
    &7Razon: &f{reason}
    &7&m──────────────────────────────────────────&r
    &fDescarga &eArgusScanner.exe&f desde:
    &b{download}
    &fIngresa este codigo cuando lo abras:
    &e&l{code}    &7(expira en 30 min, 1 solo uso)
    &7&m──────────────────────────────────────────&r
  ss_broadcast_staff: "&8[&6Argus&8] &e{staff} &7esta haciendo SS a &e{target}&7. Razon: &f{reason}"

  argus_reload_ok: "&aConfig recargada correctamente."
  argus_reload_fail: "&cError recargando config: &f{error}"
  argus_info: |
    &6&lArgus MC &fv{version} &8| &7conectado a:
    &7Endpoint: &f{endpoint}
    &7Estado:   {status}
    &7Empresa:  &f{company}
    &7Quota:    &e{used}/{quota} &7emisiones hoy.

  # ── Anti-Cheat ─────────────────────────────────────────────
  ac_alert_low: "&8[&6AC&8] &7{player} &8> &e{check} &8({details})"
  ac_alert_mid: "&8[&6AC&8] &cMID &7{player} &8> &c{check} &8({details}) &7- kick"
  ac_alert_high: "&8[&6AC&8] &4&lHIGH &7{player} &8> &4{check} &8({details}) &7- kick + SS forzado"
  ac_alert_critical: "&8[&6AC&8] &4&lCRITICAL &7{player} &8> &4{check} &8({details}) &7- BAN temporal"
  ac_kick_message: |
    &cFuiste expulsado por sospecha de cheats.
    &7Check: &f{check}
    &7Detalle: &f{details}
    &7Si crees que es un error, abre ticket en el Discord del server.
  ac_ban_message: |
    &cBaneado temporalmente por uso de cheats.
    &7Check: &f{check}
    &7Detalle: &f{details}
    &7Termina en {minutes} minutos. Apela en Discord.
