<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus — Prueba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07090d; --panel:rgba(12,15,22,.86); --line:rgba(255,255,255,.08); --text:#eef1f6; --muted:#8e97ab; --accent:#38e0d8; --bad:#ff4d6a; --ok:#3ddc84; --warn:#ffb020; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 "Space Grotesk", system-ui, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #stage canvas { display:block; }
  .glass { background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(10px); }
  #top { position:fixed; top:16px; left:16px; right:16px; display:flex; gap:12px; align-items:center; padding:10px 16px; pointer-events:none; }
  #top .brand { font-weight:700; letter-spacing:.18em; color:var(--accent); font-size:13px; }
  #top .who { font-weight:700; font-size:18px; }
  .chip { padding:3px 12px; border-radius:999px; font:700 12px "JetBrains Mono", monospace; letter-spacing:.04em; }
  .LOW { background:rgba(250,204,21,.15); color:#facc15; } .MID { background:rgba(251,146,60,.15); color:#fb923c; }
  .HIGH { background:rgba(255,77,106,.16); color:var(--bad); } .CRITICAL { background:rgba(225,29,72,.22); color:#ff6b86; }
  #top .meta { margin-left:auto; color:var(--muted); font:500 12px "JetBrains Mono", monospace; text-align:right; }
  #hud { position:fixed; left:16px; top:86px; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .stat { padding:10px 14px; min-width:190px; }
  .stat span { display:block; color:var(--muted); font:500 11px "JetBrains Mono", monospace; text-transform:uppercase; letter-spacing:.08em; }
  .stat b { font:700 22px "JetBrains Mono", monospace; }
  #alerts { position:fixed; right:16px; top:86px; width:min(340px, calc(100vw - 32px)); display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .alert { padding:10px 14px; border-left:3px solid var(--bad); animation:pop .3s cubic-bezier(.2,.9,.3,1.2); }
  .alert b { display:block; font-size:15px; } .alert small { color:var(--muted); font:500 12px "JetBrains Mono", monospace; }
  @keyframes pop { from { transform:translateX(24px); opacity:0; } to { transform:none; opacity:1; } }
  #bar { position:fixed; left:16px; right:16px; bottom:16px; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  #timeline { position:relative; height:30px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; cursor:pointer; overflow:hidden; }
  #timeline .mark { position:absolute; top:4px; bottom:4px; width:3px; border-radius:2px; }
  #timeline .atk { background:var(--warn); opacity:.6; width:2px; top:10px; bottom:10px; }
  #timeline .vio { background:var(--bad); box-shadow:0 0 8px var(--bad); }
  #timeline .played { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, rgba(56,224,216,.08), rgba(56,224,216,.22)); }
  #timeline .head { position:absolute; top:0; bottom:0; width:2px; background:#fff; box-shadow:0 0 10px #fff; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, select { background:rgba(255,255,255,.06); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:7px 14px; font:600 13px "Space Grotesk", sans-serif; cursor:pointer; }
  button:hover, select:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#032; border-color:var(--accent); }
  #time { font:500 13px "JetBrains Mono", monospace; color:var(--muted); margin-left:auto; }
  #rec { color:var(--bad); font-weight:700; display:none; }
  .legend { color:var(--muted); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  #charts { position:fixed; right:16px; top:86px; width:min(380px, calc(100vw - 32px)); max-height:calc(100vh - 250px); overflow:auto; padding:12px 14px; display:none; flex-direction:column; gap:10px; }
  body.charts-open #charts { display:flex; } body.charts-open #alerts { right:412px; }
  .chart h4 { margin:0 0 4px; font:600 12px "JetBrains Mono", monospace; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; display:flex; justify-content:space-between; }
  .chart h4 b { color:var(--text); }
  .chart canvas { width:100%; height:74px; display:block; cursor:pointer; border-radius:6px; background:rgba(255,255,255,.03); }
  #chartsBtn.on { border-color:var(--accent); color:var(--accent); }
  @media (max-width:720px) {
    #top { top:8px; left:8px; right:8px; padding:8px 12px; flex-wrap:wrap; gap:6px; } #top .who { font-size:15px; } #top .meta { display:none; }
    #hud { top:auto; bottom:92px; left:8px; flex-direction:row; gap:6px; } .stat { min-width:0; padding:6px 9px; } .stat span { font-size:9px; } .stat b { font-size:14px; }
    #alerts { top:56px; right:8px; width:calc(100vw - 16px); } .alert { padding:6px 10px; } .alert b { font-size:13px; }
    #bar { left:8px; right:8px; bottom:8px; padding:8px; gap:6px; } #timeline { height:20px; }
    .legend { display:none; } button, select { padding:5px 8px; font-size:12px; } #time { width:100%; margin-left:0; font-size:11px; }
    #charts { top:56px; right:8px; left:8px; width:auto; max-height:calc(100vh - 200px); } body.charts-open #alerts { display:none; } .chart canvas { height:56px; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="top" class="glass">
  <span class="brand">ARGUS</span><span class="who" id="who"></span><span class="chip" id="hack"></span>
  <span class="meta" id="meta"></span>
</div>
<div id="hud">
  <div class="stat glass"><span>Último golpe</span><b id="hReach">—</b></div>
  <div class="stat glass"><span>Clicks / seg</span><b id="hCps">0</b></div>
  <div class="stat glass"><span>Velocidad</span><b id="hSpeed">0.0</b></div>
</div>
<div id="alerts"></div>
<div id="charts" class="glass"></div>
<div id="bar" class="glass">
  <div id="timeline"><div class="played" id="played"></div><div class="head" id="headMark"></div></div>
  <div class="row">
    <button class="primary" id="play">▶ Reproducir</button>
    <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    <select id="cam"><option value="follow">Cámara cine</option><option value="pov">Ojos del sospechoso</option><option value="orbit">Cámara libre</option></select>
    <button id="chartsBtn">📈 Gráficos</button>
    <button id="video">⬇ Descargar video</button>
    <span id="rec">● grabando video…</span>
    <span id="time"></span>
  </div>
  <div class="legend">
    <span><i class="sw" style="background:#ff4d6a"></i>Sospechoso</span>
    <span><i class="sw" style="background:#2fa8a8"></i>Otros jugadores</span>
    <span><i class="sw" style="background:#3ddc84"></i>Golpe válido (≤3.1)</span>
    <span><i class="sw" style="background:#ff4d6a"></i>Golpe imposible</span>
    <span><i class="sw" style="background:#ffb020"></i>Hacia dónde mira</span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const D = "__REPLAY_DATA__";
const DURATION = D.meta.endMs - D.meta.startMs;
const FLAG_T = D.meta.flagMs - D.meta.startMs;
const SUSPECT = String(D.meta.suspectId);
const $ = id => document.getElementById(id);
$('who').textContent = D.meta.player;
$('hack').textContent = D.meta.hack + ' · ' + D.meta.level;
$('hack').className = 'chip ' + D.meta.level;
$('meta').innerHTML = new Date(D.meta.flagMs).toLocaleString() + '<br>' + D.meta.server + ' · ' + D.meta.world;
document.title = 'Argus — ' + D.meta.player + ' — ' + D.meta.hack;

// ================================================================ escena
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
(function sky() {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5d8fd8'); gr.addColorStop(0.55, '#9cc4f0'); gr.addColorStop(1, '#d9ecff');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; scene.background = t;
})();
scene.fog = new THREE.Fog(0xc4defa, 35, 85);
const camera = new THREE.PerspectiveCamera(65, 1, 0.05, 400);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enabled = false;
scene.add(new THREE.HemisphereLight(0xdfefff, 0x5a4a3a, 0.75));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.9);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-28, right:28, top:28, bottom:-28, near:1, far:120 });
sun.shadow.bias = -0.0008;
scene.add(sun); scene.add(sun.target);

// ================================================================ texturas pixel (generadas, 16x16)
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function hashStr(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function tex(draw, seed, transparent) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d'); draw(g, rng(seed));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.encoding = THREE.sRGBEncoding;
  t.userData = { transparent }; return t;
}
function shade(hex, f) { const c = new THREE.Color(hex); c.multiplyScalar(f); return '#' + c.getHexString(); }
function noise(base, amt) { return (g, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = shade(base, 1 - amt + r() * amt * 2); g.fillRect(x, y, 1, 1); } }; }
const P = {
  grassTop: (g, r) => noise(0x6aa84f, 0.18)(g, r),
  dirt: (g, r) => noise(0x86603e, 0.2)(g, r),
  grassSide: (g, r) => { noise(0x86603e, 0.2)(g, r); for (let x = 0; x < 16; x++) { const h = 3 + Math.floor(r() * 2.5); for (let y = 0; y < h; y++) { g.fillStyle = shade(0x6aa84f, 0.85 + r() * 0.3); g.fillRect(x, y, 1, 1); } } },
  stone: (g, r) => noise(0x8e8e8e, 0.14)(g, r),
  cobble: (g, r) => { noise(0x7a7a7a, 0.1)(g, r); for (let i = 0; i < 9; i++) { const x = r() * 14 | 0, y = r() * 14 | 0, w = 3 + (r() * 4 | 0), h = 2 + (r() * 3 | 0); g.fillStyle = shade(0x9a9a9a, 0.85 + r() * 0.3); g.fillRect(x, y, w, h); g.fillStyle = '#4e4e4e'; g.fillRect(x, y + h, w, 1); } },
  logSide: (g, r) => { for (let x = 0; x < 16; x++) { const b = 0.75 + r() * 0.4; for (let y = 0; y < 16; y++) { g.fillStyle = shade(0x6b4f2c, b * (0.92 + r() * 0.12)); g.fillRect(x, y, 1, 1); } } },
  logTop: (g, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const d = Math.hypot(x - 7.5, y - 7.5); g.fillStyle = d > 6.8 ? shade(0x5a4024, 0.9 + r() * 0.2) : shade(0xb48a55, (Math.floor(d) % 2 ? 0.85 : 1.05) + r() * 0.08); g.fillRect(x, y, 1, 1); } },
  planks: (g, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = y % 4 === 3 ? '#6e5532' : shade(0xb08850, 0.88 + r() * 0.2); g.fillRect(x, y, 1, 1); } },
  leaves: (g, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { if (r() < 0.16) continue; g.fillStyle = shade(0x3f8a2a, 0.65 + r() * 0.55); g.fillRect(x, y, 1, 1); } },
  sand: (g, r) => noise(0xdccf98, 0.08)(g, r),
  glass: (g) => { g.clearRect(0, 0, 16, 16); g.fillStyle = 'rgba(210,240,255,.18)'; g.fillRect(0, 0, 16, 16); g.fillStyle = 'rgba(235,250,255,.9)'; g.fillRect(0, 0, 16, 1); g.fillRect(0, 15, 16, 1); g.fillRect(0, 0, 1, 16); g.fillRect(15, 0, 1, 16); g.fillRect(4, 4, 2, 1); g.fillRect(5, 5, 2, 1); },
  water: (g, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = shade(0x3f76e4, 0.85 + r() * 0.25); g.fillRect(x, y, 1, 1); } },
  lava: (g, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = shade(0xe86a1a, 0.8 + r() * 0.5); g.fillRect(x, y, 1, 1); } },
  ore: base => (g, r) => { noise(0x8e8e8e, 0.14)(g, r); for (let i = 0; i < 6; i++) { const x = r() * 13 | 0, y = r() * 13 | 0; g.fillStyle = shade(base, 0.85 + r() * 0.3); g.fillRect(x, y, 2, 2); g.fillRect(x + 1, y + 1, 2, 1); } },
  brick: (g, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const mortar = y % 4 === 3 || (x + (Math.floor(y / 4) % 2) * 4) % 8 === 7; g.fillStyle = mortar ? '#b9b1a5' : shade(0x96473a, 0.85 + r() * 0.25); g.fillRect(x, y, 1, 1); } },
  ice: (g, r) => noise(0x9ec3f0, 0.1)(g, r),
  snow: (g, r) => noise(0xf3f7fb, 0.04)(g, r),
  generic: base => (g, r) => noise(base, 0.14)(g, r),
};
const texCache = {};
function T(key, fn, transparent) { return texCache[key] || (texCache[key] = tex(fn, hashStr(key), transparent)); }
function faces(name) {     // [lados, arriba, abajo]
  const n = name;
  if (n === 'grass_block' || n === 'podzol' || n === 'mycelium') return [T('gs', P.grassSide), T('gt', P.grassTop), T('d', P.dirt)];
  if (n.includes('log') || n.includes('_wood') || n.includes('stem')) return [T('ls', P.logSide), T('lt', P.logTop), T('lt', P.logTop)];
  if (n.includes('leaves')) { const t = T('lv', P.leaves, true); return [t, t, t]; }
  if (n.includes('glass')) { const t = T('gl', P.glass, true); return [t, t, t]; }
  if (n.includes('water')) { const t = T('w', P.water, true); return [t, t, t]; }
  if (n.includes('lava')) { const t = T('lv2', P.lava); return [t, t, t]; }
  const one = (k, f) => { const t = T(k, f); return [t, t, t]; };
  if (n.includes('dirt') || n === 'farmland' || n === 'mud' || n === 'coarse_dirt') return one('d', P.dirt);
  if (n.includes('plank') || n.includes('bookshelf') || n.includes('crafting')) return one('pl', P.planks);
  if (n.includes('cobble') || n.includes('mossy')) return one('cb', P.cobble);
  if (n.includes('coal_ore')) return one('oc', P.ore(0x222222));
  if (n.includes('iron_ore')) return one('oi', P.ore(0xd8af93));
  if (n.includes('gold_ore')) return one('og', P.ore(0xfcee4b));
  if (n.includes('diamond_ore')) return one('od', P.ore(0x5decf5));
  if (n.includes('redstone_ore')) return one('or', P.ore(0xd10000));
  if (n.includes('emerald_ore')) return one('oe', P.ore(0x17dd62));
  if (n.includes('lapis_ore')) return one('ol', P.ore(0x1f4fbf));
  if (n.includes('sand')) return one('s', P.sand);
  if (n.includes('brick')) return one('br', P.brick);
  if (n.includes('ice')) return one('ic', P.ice);
  if (n.includes('snow')) return one('sn', P.snow);
  if (n.includes('stone') || n.includes('andesite') || n.includes('diorite') || n.includes('granite') || n.includes('deepslate') || n.includes('tuff')) {
    const base = n.includes('deepslate') ? 0x55555c : n.includes('diorite') ? 0xc8c8c8 : n.includes('granite') ? 0x9a6b56 : 0x8e8e8e;
    return one('st' + base, P.generic(base));
  }
  const h = hashStr(n), col = new THREE.Color().setHSL((h % 360) / 360, 0.28, 0.5).getHex();
  return one('g' + n, P.generic(col));
}

// ================================================================ bloques
(function buildBlocks() {
  const pal = D.blocks.palette, a = D.blocks.data, n = a.length / 4;
  const byMat = {};
  for (let i = 0; i < n; i++) (byMat[a[i * 4 + 3]] = byMat[a[i * 4 + 3]] || []).push(i);
  const geo = new THREE.BoxGeometry(1, 1, 1), m4 = new THREE.Matrix4();
  for (const [idx, list] of Object.entries(byMat)) {
    const name = pal[idx];
    const [side, top, bottom] = faces(name);
    const liquid = name.includes('water') || name.includes('lava');
    const mk = t => new THREE.MeshLambertMaterial({ map:t, transparent:liquid || t.userData.transparent, opacity:liquid ? 0.72 : 1, alphaTest:t.userData.transparent && !liquid ? 0.3 : 0, side:t.userData.transparent ? THREE.DoubleSide : THREE.FrontSide, depthWrite:!liquid });
    const mats = [mk(side), mk(side), mk(top), mk(bottom), mk(side), mk(side)];
    const mesh = new THREE.InstancedMesh(geo, mats, list.length);
    list.forEach((i, j) => { m4.makeTranslation(a[i * 4] + 0.5, a[i * 4 + 1] + 0.5, a[i * 4 + 2] + 0.5); mesh.setMatrixAt(j, m4); });
    mesh.receiveShadow = true; mesh.castShadow = !liquid;
    scene.add(mesh);
  }
})();

// ================================================================ modelos
function nameTag(text, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const g = c.getContext('2d'); g.font = '700 46px "Space Grotesk", system-ui';
  const w = Math.min(500, g.measureText(text).width + 40);
  g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect((512 - w) / 2, 14, w, 66);
  g.fillStyle = color; g.textAlign = 'center'; g.fillText(text, 256, 63);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, depthTest:false, transparent:true }));
  s.scale.set(2.4, 0.45, 1); s.renderOrder = 10; return s;
}
function faceTex(skin, eyes) {
  return tex(g => { g.fillStyle = skin; g.fillRect(0, 0, 16, 16); g.fillStyle = '#3b2a1c'; g.fillRect(0, 0, 16, 4);
    g.fillStyle = '#fff'; g.fillRect(3, 7, 3, 2); g.fillRect(10, 7, 3, 2); g.fillStyle = eyes; g.fillRect(4, 7, 2, 2); g.fillRect(10, 7, 2, 2);
    g.fillStyle = '#7a4a3a'; g.fillRect(6, 11, 4, 1); }, 7);
}
function box(w, h, d, color, ox = 0, oy = 0, oz = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(ox, oy, oz); m.castShadow = true; return m;
}
function humanoid(c) {      // c: {skin, shirt, pants, eyes}. Mira hacia +Z: su derecha es -X.
  const s = 0.9, root = new THREE.Group();
  const legL = new THREE.Group(), legR = new THREE.Group(), armL = new THREE.Group(), armR = new THREE.Group(), head = new THREE.Group();
  legR.position.set(-0.125 * s, 0.75 * s, 0); legL.position.set(0.125 * s, 0.75 * s, 0);
  legL.add(box(0.25 * s, 0.75 * s, 0.25 * s, c.pants, 0, -0.375 * s)); legR.add(box(0.25 * s, 0.75 * s, 0.25 * s, c.pants, 0, -0.375 * s));
  armR.position.set(-0.375 * s, 1.5 * s, 0); armL.position.set(0.375 * s, 1.5 * s, 0);
  armL.add(box(0.25 * s, 0.75 * s, 0.25 * s, c.shirt, 0, -0.375 * s)); armR.add(box(0.25 * s, 0.75 * s, 0.25 * s, c.shirt, 0, -0.375 * s));
  armL.children[0].add(box(0.251 * s, 0.3 * s, 0.251 * s, c.skin, 0, -0.23 * s)); armR.children[0].add(box(0.251 * s, 0.3 * s, 0.251 * s, c.skin, 0, -0.23 * s));
  const body = box(0.5 * s, 0.75 * s, 0.25 * s, c.shirt, 0, 1.125 * s);
  head.position.set(0, 1.5 * s, 0);
  const hm = new THREE.Mesh(new THREE.BoxGeometry(0.5 * s, 0.5 * s, 0.5 * s), [
    new THREE.MeshLambertMaterial({ color:c.skin }), new THREE.MeshLambertMaterial({ color:c.skin }),
    new THREE.MeshLambertMaterial({ color:0x3b2a1c }), new THREE.MeshLambertMaterial({ color:c.skin }),
    new THREE.MeshLambertMaterial({ map:faceTex('#' + new THREE.Color(c.skin).getHexString(), c.eyes) }), new THREE.MeshLambertMaterial({ color:0x3b2a1c })]);

  cg.fillStyle = '#38e0d8'; cg.font = '700 15px "Space Grotesk", sans-serif'; cg.fillText('ARGUS', 44, 60);
  cg.fillStyle = '#fff'; cg.font = '700 24px "Space Grotesk", sans-serif'; cg.fillText(D.meta.player, 118, 62);
  const lvlCol = { LOW:'#facc15', MID:'#fb923c', HIGH:'#ff4d6a', CRITICAL:'#ff6b86' }[D.meta.level] || '#fff';
  const pw = cg.measureText(D.meta.player).width;
  cg.font = '700 15px "JetBrains Mono", monospace'; cg.fillStyle = lvlCol; cg.fillText(D.meta.hack + ' · ' + D.meta.level, 140 + pw, 61);
  const rows = [['ÚLTIMO GOLPE', stats.reach == null ? '—' : stats.reach.toFixed(2) + ' b', stats.reach != null && stats.reach > 3.1 ? '#ff4d6a' : '#3ddc84'], ['CLICKS / SEG', String(stats.cps), '#fff'], ['VELOCIDAD', stats.speed.toFixed(1) + ' b/s', '#fff']];
  rows.forEach(([k, v, c], i) => {
    const y = 104 + i * 70; cg.fillStyle = 'rgba(8,10,14,.78)'; rr(24, y, 220, 58, 12); cg.fill();
    cg.fillStyle = '#8e97ab'; cg.font = '500 11px "JetBrains Mono", monospace'; cg.fillText(k, 40, y + 21);
    cg.fillStyle = c; cg.font = '700 22px "JetBrains Mono", monospace'; cg.fillText(v, 40, y + 47);
  });
  activeAlerts.slice(-3).forEach((a, i) => {
    const y = 104 + i * 70; cg.fillStyle = 'rgba(8,10,14,.82)'; rr(1280 - 404, y, 380, 58, 12); cg.fill();
    cg.fillStyle = '#ff4d6a'; cg.fillRect(1280 - 404, y, 4, 58);
    cg.font = '700 17px "Space Grotesk", sans-serif'; cg.fillText(a.v.label + ' · ' + a.v.level, 1280 - 388, y + 25);
    cg.fillStyle = '#c7cdd9'; cg.font = '500 12px "JetBrains Mono", monospace'; cg.fillText(a.v.details.slice(0, 46), 1280 - 388, y + 45);
  });
  cg.fillStyle = 'rgba(8,10,14,.78)'; rr(24, 660, 1232, 38, 12); cg.fill();
  cg.fillStyle = 'rgba(56,224,216,.25)'; cg.fillRect(36, 674, 1208 * t / DURATION, 10);
  for (const v of D.violations) { cg.fillStyle = '#ff4d6a'; cg.fillRect(36 + 1208 * (v.t - D.meta.startMs) / DURATION - 1, 670, 3, 18); }
  cg.fillStyle = '#fff'; cg.fillRect(36 + 1208 * t / DURATION - 1, 668, 2, 22);
  cg.fillStyle = '#c7cdd9'; cg.font = '500 13px "JetBrains Mono", monospace';
  cg.fillText(fmt(t) + '   ·   ' + new Date(D.meta.flagMs).toLocaleString() + '   ·   ' + D.meta.server, 36, 650);
}
let recorder = null;
$('video').onclick = () => {
  if (recorder) return;
  const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) { alert('Este navegador no puede grabar video. Probá con Chrome o Edge.'); return; }
  const chunks = [];
  recorder = new MediaRecorder(comp.captureStream(60), { mimeType:mime, videoBitsPerSecond:10_000_000 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm', a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type:mime.split(';')[0] }));
    a.download = 'argus_' + D.meta.player + '_' + D.meta.hack + '_' + D.meta.flagMs + '.' + ext; a.click();
    recorder = null; $('rec').style.display = 'none';
  };
  $('speed').value = '1'; seek(0); setPlaying(true);
  $('rec').style.display = 'inline'; recorder.start(250);
};

function loop(now) {
  const dt = Math.min(100, now - last); last = now;
  if (playing) {
    t += dt * parseFloat($('speed').value);
    if (t >= DURATION) { t = DURATION; setPlaying(false); if (recorder) recorder.stop(); }
  }
  update(dt); placeCamera(dt); renderer.render(scene, camera); drawCharts();
  if (recorder) drawComposite();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
