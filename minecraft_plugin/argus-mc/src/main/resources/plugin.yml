name: ArgusMC
version: ${project.version}
main: com.argusprojects.argusmc.ArgusPlugin
api-version: '1.19'
author: Argus Projects
authors: [Argus Projects]
website: https://argusprojects.com
description: Argus anti-cheat — Screen Share + detector de hacks (LuckyPerms compatible)

# LuckyPerms se hookea automaticamente: usamos hasPermission() de Bukkit y LP responde.
softdepend: [LuckyPerms]

commands:
  argus:
    description: Comando unificado de Argus (check / reload / info / test)
    usage: |
      /argus check <jugador> [razon] - emite codigo de Screen Share
      /argus reload                  - recarga config.yml
      /argus info                    - muestra estado y quota
      /argus test                    - health check de la API
    aliases: []

permissions:
  argus.ss.use:
    description: Permite usar /argus check para emitir un Screen Share
    default: op
  argus.ss.bypass:
    description: Exime al jugador de poder ser objetivo de /argus check
    default: false
  argus.ss.notify:
    description: Recibe el broadcast cuando otro staff ejecuta /argus check
    default: false
  argus.alerts:
    description: Recibe alertas en chat cuando el anti-cheat detecta violations
    default: op
  argus.ac.bypass:
    description: Exime al jugador del anti-cheat (NO acumula violations)
    default: false
  argus.admin:
    description: Permite recargar la config y ver info del plugin
    default: op
