name: ArgusMC
version: ${project.version}
main: com.argusprojects.argusmc.ArgusPlugin
api-version: '1.19'
author: Argus Projects
authors: [Argus Projects]
website: https://argusprojects.com
description: Argus anti-cheat — emite tokens de Screen Share desde el server (LuckyPerms compatible)

# LuckyPerms se hookea automaticamente: usamos hasPermission() de Bukkit y LP responde.
softdepend: [LuckyPerms]

commands:
  ss:
    description: Genera un codigo de Screen Share para un jugador y se lo envia
    usage: /ss <player> [reason]
    aliases: [argusss, screenshare]
    permission: argus.ss.use
    permission-message: "&cNo tienes permiso para usar /ss. Pidele a un admin que te asigne el permiso 'argus.ss.use'."
  argus:
    description: Comandos administrativos del plugin Argus
    usage: /argus <reload|info|test>
    permission: argus.admin
    permission-message: "&cNo tienes permiso para usar /argus."

permissions:
  argus.ss.use:
    description: Permite usar /ss para solicitar un Screen Share
    default: op
  argus.ss.bypass:
    description: Exime al jugador de poder ser objetivo de /ss
    default: false
  argus.admin:
    description: Permite recargar la config y ver info del plugin
    default: op
