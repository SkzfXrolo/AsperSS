<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Imperial — Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sa-imperial.css') }}">
    <style>
        body.imp-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .imp-login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            background: var(--imp-surface);
            border: 1px solid var(--imp-border-h);
            border-radius: var(--imp-r);
            box-shadow: var(--imp-shadow), var(--imp-glow);
            backdrop-filter: blur(20px);
        }
        .imp-login-card h1 {
            font-family: var(--imp-display);
            font-size: 1.5rem;
            text-align: center;
            color: var(--imp-champagne);
            margin-bottom: 0.35rem;
        }
        .imp-login-card .sub {
            text-align: center;
            font-size: 0.8rem;
            color: var(--imp-muted);
            margin-bottom: 1.75rem;
        }
        .imp-login-card .imp-field { margin-bottom: 1rem; }
        .imp-login-card .imp-btn { width: 100%; margin-top: 0.5rem; }
        .imp-login-error {
            background: var(--imp-rose-soft);
            border: 1px solid var(--imp-rose);
            color: #FCA5A5;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            text-align: center;
        }
        .imp-login-shield {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 380px;
            height: 380px;
            margin: -190px 0 0 -190px;
            opacity: 0.04;
            pointer-events: none;
            color: var(--imp-gold);
        }
        .imp-login-shield svg { width: 100%; height: 100%; fill: currentColor; }
    </style>
</head>
<body class="imp-body imp-login">
    <div class="imp-ambient"></div>
    <div class="imp-grid-bg"></div>
    <div class="imp-login-shield" aria-hidden="true">
        <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 4 L8 22 L8 58 Q8 92 50 116 Q92 92 92 58 L92 22 Z"/>
        </svg>
    </div>
    <div class="imp-login-card">
        <h1>◆ IMPERIAL</h1>
        <p class="sub">Acceso exclusivo Super Admin</p>
        {% if error %}
        <div class="imp-login-error">{{ error }}</div>
        {% endif %}
        <form method="POST" id="sa-login-form">
            <div class="imp-field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="imp-field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="imp-btn imp-btn-gold">Entrar al imperio</button>
        </form>
    </div>
</body>
</html>
