<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="csrf-token" content="{{ csrf_token_value }}">
  <title>Argus · Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/panel_v2.css') }}?v=13">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <span class="brand-txt">ARGUS<b>STAFF</b></span>
    </div>

    <nav class="nav">
      <div class="nav-label">Operación</div>
      <a class="nav-item" href="#/inicio"><span class="ico">◫</span><span class="lbl">Inicio</span></a>
      <a class="nav-item" href="#/revision"><span class="ico">⚖</span><span class="lbl">Revisión</span></a>
      <a class="nav-item" href="/warroom"><span class="ico">◎</span><span class="lbl">War Room</span> <span class="tag">LIVE</span></a>

      <div class="nav-label">Detección</div>
      <a class="nav-item" href="#/anticheat"><span class="ico">◈</span><span class="lbl">Anticheat</span></a>
      <a class="nav-item" href="#/ia"><span class="ico">✦</span><span class="lbl">Argus AI</span></a>

      <div class="nav-label">Configuración</div>
      <a class="nav-item" href="#/servidores"><span class="ico">⬡</span><span class="lbl">Servidores</span></a>
      <a class="nav-item" href="#/equipo"><span class="ico">◔</span><span class="lbl">Equipo</span></a>

      <div class="nav-label" data-admin hidden>Plataforma</div>
      <a class="nav-item" href="#/admin" data-admin hidden><span class="ico">⚙</span><span class="lbl">Administración</span></a>
    </nav>

    <div class="spacer"></div>
    <div class="foot">
      <div class="who">
        <span class="avatar" id="foot-avatar">?</span>
        <span class="stack">
          <b id="foot-user">…</b>
          <span id="foot-role"></span>
        </span>
      </div>
      <div class="foot-links">
        <a href="/panel">↩ Panel clásico</a>
        <a href="/logout">Cerrar sesión</a>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menú">☰</button>
      <div class="title-wrap">
        <h1 id="view-title">Inicio</h1>
        <span class="sub" id="view-sub"></span>
      </div>
      <div class="grow"></div>
      <span class="pill pill-live"><span class="live"></span> en línea</span>
      <span class="pill pill-ver">SCANNER <b>{{ scanner_version }}</b></span>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<script>
  window.ARGUS_V2 = {
    user: {{ (user or {}) | tojson }},
    staffRole: {{ (staff_role or 'helper') | tojson }},
    isOwner: {{ (is_panel_owner or false) | tojson }},
    scannerVersion: {{ (scanner_version or '') | tojson }}
  };
</script>
<script src="{{ url_for('static', filename='js/panel_v2.js') }}?v=13"></script>
</body>
</html>
