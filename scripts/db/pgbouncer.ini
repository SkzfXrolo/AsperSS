; ===========================================================================
; Argus Projects — Pack 48-H Round 3 · #91
; pgbouncer.ini
; ---------------------------------------------------------------------------
; PgBouncer config para Argus. Tier-agnostic (sólo ajustar default_pool_size).
; Sustituir HOST_PRIMARIO y credenciales antes de usar.
; ===========================================================================

[databases]
; Mapeo lógico → real. La app conecta a "argus" en localhost:6432.
argus = host=HOST_PRIMARIO port=5432 dbname=argus_prod
argus_readonly = host=HOST_REPLICA port=5432 dbname=argus_prod

[pgbouncer]
; --- Networking ---------------------------------------------------------
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer

; --- Auth ---------------------------------------------------------------
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; userlist.txt formato: "usuario" "SCRAM-HASH"
admin_users = pgb_admin
stats_users = pgb_stats

; --- Pool ---------------------------------------------------------------
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 50
max_user_connections = 50

; --- Timeouts -----------------------------------------------------------
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0
client_login_timeout = 60
idle_transaction_timeout = 30

; --- TLS hacia Postgres -------------------------------------------------
server_tls_sslmode = require
server_tls_ca_file = /etc/pgbouncer/ca.crt

; --- TLS hacia clientes -------------------------------------------------
client_tls_sslmode = prefer
; client_tls_cert_file = /etc/pgbouncer/server.crt
; client_tls_key_file  = /etc/pgbouncer/server.key

; --- Logging ------------------------------------------------------------
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

; --- Compatibilidad SQLAlchemy / psycopg --------------------------------
; disable_prepared_statements: necesario solo si PgBouncer <1.21 + transaction.
; Si usás PG14+ y PgBouncer ≥1.21, podés mantener prepared statements.
; ignore_startup_parameters: cliente puede setear extra options.
ignore_startup_parameters = extra_float_digits,options
application_name_add_host = 1

; --- Hostname resolution (DNS) ------------------------------------------
dns_max_ttl = 15
dns_zone_check_period = 0

; ===========================================================================
; FIN — ver docs/db/connection-pool.md para racional, métricas y rollout.
