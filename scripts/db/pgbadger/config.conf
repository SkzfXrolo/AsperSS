## ===========================================================================
## Argus Projects — Pack 48-H Round 4 · #110
## pgbadger config (mirror of CLI flags; some are CLI-only).
##
## Uso desde run-analysis.sh:
##   pgbadger -j 4 -f stderr -o /tmp/argus-report.html /var/log/postgresql/*.log
##
## NOTA: pgbadger NO lee config files; este archivo es documentación
## ejecutable. Para usar: source este archivo en bash y referenciar las vars.
## ===========================================================================

# Formato de log esperado en postgresql.conf:
# log_destination = 'stderr'
# logging_collector = on
# log_min_duration_statement = 200          # ms; <100 satura el log
# log_line_prefix = '%t [%p] %u@%d/%a '     # fecha PID user@db/appname
# log_statement = 'ddl'                     # registra cambios DDL
# log_lock_waits = on
# log_temp_files = 0                        # registra TODO tempfile

PGBADGER_INPUT_DIR="/var/log/postgresql"
PGBADGER_GLOB="postgresql-*.log"
PGBADGER_OUTPUT="/var/log/argus/pgbadger-$(date -u +%Y%m%dT%H%M%SZ).html"
PGBADGER_FORMAT="html"               # html | json | text | tsung | bin
PGBADGER_JOBS="4"                    # paralelismo CPU
PGBADGER_PARSER_FORMAT="stderr"
PGBADGER_MIN_DURATION="200"          # ms; queries más cortas se descartan
PGBADGER_TIMEZONE="UTC"
PGBADGER_ANONYMIZE="1"               # esconde literales en queries (PII)
PGBADGER_EXCLUDE_QUERY="^(SET|BEGIN|COMMIT|ROLLBACK|RELEASE|SAVEPOINT|LISTEN)"
PGBADGER_INCREMENTAL_DIR="/var/log/argus/pgbadger-incremental"

# Filtros temporales (override para análisis ad-hoc):
# PGBADGER_BEGIN="2026-05-11 00:00:00"
# PGBADGER_END="2026-05-12 00:00:00"

# Render specifics:
# Render PG no entrega acceso al fs de logs directamente. Las opciones son:
#   1) Habilitar log shipping a S3/syslog y correr pgbadger sobre eso.
#   2) Usar 'render logs --tail' y redirigir a archivo (lossy si rotan rápido).
#   3) Usar la integración Datadog/Better Stack y exportar.
# Documentado en docs/db/pgbadger-guide.md.

# Threshold ALERT en el report:
# - queries con duración media > 500ms
# - queries con > 10 ejecuciones/segundo
# - tempfiles > 10MB en una sola query
# - lock waits > 5s
