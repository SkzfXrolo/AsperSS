apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argus-web
  template:
    metadata:
      labels:
        app: argus-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
