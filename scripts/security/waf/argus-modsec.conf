SecRuleEngine On

# Protect auth endpoints
SecRule REQUEST_URI "@beginsWith /api/auth/login" \
  "id:100001,phase:2,deny,status:429,msg:'Auth rate limit threshold reached',chain"
SecRule IP:AUTH_ATTEMPTS "@gt 20" "setvar:ip.auth_block=1,expirevar:ip.auth_block=60"

# Optional geo block for admin
SecRule REQUEST_URI "@beginsWith /api/admin/" \
  "id:100002,phase:1,deny,status:403,msg:'Admin geo policy block',chain"
SecRule GEO:COUNTRY_CODE "!@within AR,UY,CL,BR,US"

# Basic XSS signature block
SecRule ARGS|REQUEST_BODY "@rx (?i)<script|onerror\\s*=|javascript:" \
  "id:100003,phase:2,deny,status:403,msg:'Potential XSS payload blocked'"
