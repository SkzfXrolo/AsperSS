[pytest]
testpaths = tests
pythonpath = web_app
addopts = -q -m "not perf and not e2e and not load and not smoke" --cov=argus_ai_oracle --cov=argus_ai_features --cov=argus_ai_trainer --cov=argus_ai_labeler --cov=argus_ai_assistant --cov-report=term-missing --cov-fail-under=70
markers =
    perf: tests de performance basica
    e2e: tests end-to-end con navegador
    load: tests de carga
    smoke: checks de entorno productivo
    contract: tests de contratos API
    chaos: tests de resiliencia y caos
    fuzz: tests de fuzzing/stateful
    integration: tests de integracion profunda
