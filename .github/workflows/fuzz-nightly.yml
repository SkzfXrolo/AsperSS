name: Fuzz nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      - name: Run fuzz tests
        run: |
          python -m pytest --no-cov -m fuzz tests/fuzz -q
