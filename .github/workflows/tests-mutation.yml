name: tests-mutation

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r tests/requirements-test.txt
      - run: bash tests/mutation/run-targeted.sh web_app/argus_ai_oracle.py
