name: Scanner Build

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "scripts/linux/**"
      - ".github/workflows/scanner-build.yml"
  pull_request:
    paths:
      - "source/**"
      - "scripts/linux/**"
      - ".github/workflows/scanner-build.yml"
  workflow_dispatch:

jobs:
  build-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Build scanner (onefile)
        run: |
          set -euo pipefail
          pyinstaller --clean --noconfirm --onefile ArgusScanner.spec

      - name: Upload scanner artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanner-linux-${{ github.sha }}
          path: dist/*
          retention-days: 14
