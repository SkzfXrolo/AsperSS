name: perf-budgets

on:
  pull_request:
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      - name: Run perf regression
        run: python -m pytest tests/perf/test_regression.py -q
      - name: Lighthouse placeholder
        run: echo "Integrar Lighthouse CI cuando exista target estable"
      - name: Upload perf artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-report
          path: tests/perf/baselines/
