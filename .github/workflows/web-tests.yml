name: Web tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            tests/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Run unit/property/security suite
        run: |
          python -m pytest tests/ --ignore=tests/integration --ignore=tests/perf --cov=argus_ai_oracle --cov=argus_ai_features --cov=argus_ai_trainer --cov=argus_ai_labeler --cov=argus_ai_assistant --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: |
            coverage.xml

  integration:
    name: Integration (${{ matrix.python-version }})
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            tests/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Run integration tests
        run: |
          python -m pytest --no-cov tests/integration -q

  perf:
    name: Perf (3.11)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            tests/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Run perf tests
        run: |
          python -m pytest --no-cov -m perf tests/perf -q

  snapshot:
    name: Snapshot (3.11)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/requirements-test.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      - name: Verify snapshots
        run: |
          python -m pytest --no-cov tests/snapshot -q

  contract:
    name: Contract (3.11)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/requirements-test.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      - name: Run contract tests
        run: |
          python -m pytest --no-cov -m contract tests/contract -q

  chaos:
    name: Chaos (3.11)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/requirements-test.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      - name: Run chaos tests
        run: |
          python -m pytest --no-cov -m chaos tests/chaos -q

  e2e:
    name: E2E Playwright (3.11)
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/requirements-test.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      - name: Install Playwright browser
        run: |
          python -m playwright install chromium
      - name: Run e2e tests
        run: |
          python -m pytest --no-cov -m e2e tests/e2e tests/a11y -q

  smoke:
    name: Smoke post-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/requirements-test.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      - name: Run smoke tests
        env:
          ARGUS_PROD_URL: https://asperss.onrender.com
        run: |
          python -m pytest --no-cov -m smoke tests/smoke -q
