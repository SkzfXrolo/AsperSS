name: Android APK Build

# Item Android #12 + #15 — pipeline CI para compilar y firmar el APK release
# en cada push que toque mobile/argus_android/.
#
# Cambios en Pack 27:
#   * Build assembleRelease (no debug) con keystore self-signed propio.
#   * El keystore se persiste entre runs en una release oculta `_keystore`,
#     así la firma es ESTABLE entre builds: el OTA updater de la app puede
#     instalar APKs nuevos como "update" del previo sin obligar a desinstalar.
#   * BuildConfig recibe BUILD_COMMIT y BUILD_TIMESTAMP, leídos por la app
#     para mostrar versión real y comparar contra /api/android-version.
#
# Se ejecuta:
#   - En push a main que cambia mobile/argus_android/** o este workflow
#   - En PR que toca esos paths (sin publicar release; solo artifact)
#   - Manualmente vía workflow_dispatch
#
# Output:
#   - argus-android-release-<sha>.zip como artifact (devs, 30 días)
#   - argus-android.apk firmado en release "android-latest" (URL pública estable)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/argus_android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'mobile/argus_android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # gradle/actions/setup-gradle@v4 instala una versión específica de
      # Gradle (no usa la del runner, que puede ser Gradle 9.x e incompatible
      # con AGP 8.2.2) y maneja caché de dependencias automáticamente.
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
          cache-read-only: false

      # ── Item Android #15 — keystore self-signed persistente ───────────────
      # El keystore se guarda como asset de un release oculto `_keystore`.
      # Si existe, lo restauramos. Si no, generamos uno y lo subimos. El
      # password es público porque self-signed sin Play Console — la
      # consistencia entre builds es lo que importa para que Android
      # acepte updates sin desinstalar.
      - name: Restore or seed Argus signing keystore
        id: keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASS: argus_release_keystore_v1
        working-directory: mobile/argus_android
        run: |
          set -e
          mkdir -p signing
          if gh release download _keystore -p "argus-release.jks" -D signing 2>/dev/null; then
            echo "keystore_source=restored" >> "$GITHUB_OUTPUT"
            echo "Keystore restaurado desde release _keystore."
          else
            echo "keystore_source=generated" >> "$GITHUB_OUTPUT"
            echo "Generando keystore self-signed nuevo (1ra vez)…"
            keytool -genkeypair -v \
              -keystore signing/argus-release.jks \
              -storepass "$KEYSTORE_PASS" \
              -keypass   "$KEYSTORE_PASS" \
              -alias argus \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Argus Anti-Cheat, OU=Argus Projects, O=AsperSS, L=Buenos Aires, ST=BA, C=AR"
            gh release create _keystore signing/argus-release.jks \
              --title "Argus signing keystore (do not delete)" \
              --notes "Self-signed RSA-2048 keystore para firmar Argus Android. Auto-generado por android-build.yml. NO BORRAR — borrarlo cambia la firma y rompe updates en dispositivos existentes." \
              --prerelease
          fi
          echo "keystore_path=mobile/argus_android/signing/argus-release.jks" >> "$GITHUB_OUTPUT"

      # PRs no tienen acceso a write y no necesitan firmar contra producción.
      # Para PRs generamos un keystore efímero solo para que la build pase.
      - name: Generate ephemeral PR keystore
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        working-directory: mobile/argus_android
        env:
          KEYSTORE_PASS: argus_release_keystore_v1
        run: |
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/argus-release.jks \
            -storepass "$KEYSTORE_PASS" \
            -keypass   "$KEYSTORE_PASS" \
            -alias argus \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Argus PR Build, OU=ci, O=AsperSS, L=BA, ST=BA, C=AR"

      - name: Build release APK
        id: build
        working-directory: mobile/argus_android
        env:
          ARGUS_KEYSTORE_PATH: signing/argus-release.jks
          ARGUS_KEYSTORE_PASS: argus_release_keystore_v1
          ARGUS_KEY_ALIAS:     argus
          ARGUS_KEY_PASS:      argus_release_keystore_v1
          ARGUS_BUILD_COMMIT:  ${{ github.sha }}
          ARGUS_BUILD_NUMBER:  ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info assembleRelease 2>&1 | tee build.log

      - name: Dump build log on failure
        if: failure() && steps.build.outcome == 'failure'
        working-directory: mobile/argus_android
        run: |
          echo "## Build log (last 600 lines)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 600 build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure (always available)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.sha }}
          path: mobile/argus_android/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Locate APK
        id: locate
        working-directory: mobile/argus_android
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No se encontró el APK release"
            exit 1
          fi
          cp "$APK" app/build/outputs/apk/release/argus-android.apk
          echo "apk=app/build/outputs/apk/release/argus-android.apk" >> "$GITHUB_OUTPUT"

      # Pack 27 hotfix — re-firma manual con apksigner garantizando v1+v2+v3.
      # AGP 8.2.2 con signingConfig+enableV1Signing tuvo que generar v1, pero
      # el APK descargado seguía sin META-INF/CERT.SF. Forzamos manualmente
      # para descartar todo riesgo: zipalign primero (mandatorio antes de
      # apksigner) + sign con los 3 schemes habilitados explícitamente.
      - name: Zipalign + re-sign APK (v1+v2+v3 failsafe)
        working-directory: mobile/argus_android
        env:
          KS_PASS: argus_release_keystore_v1
        run: |
          set -e
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign  | sort -V | tail -n1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          echo "zipalign:  $ZIPALIGN"
          echo "apksigner: $APKSIGNER"
          IN=app/build/outputs/apk/release/argus-android.apk
          OUT=app/build/outputs/apk/release/argus-android-aligned.apk
          "$ZIPALIGN" -p -f 4 "$IN" "$OUT"
          mv "$OUT" "$IN"
          "$APKSIGNER" sign \
            --ks signing/argus-release.jks \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias argus \
            --key-pass "pass:$KS_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$IN"

      - name: Verify APK signature (must include v1+v2+v3)
        id: verify
        working-directory: mobile/argus_android
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          OUT=$("$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/release/argus-android.apk)
          echo "$OUT"
          echo "## APKsigner verify" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUT" | head -n 30 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if ! echo "$OUT" | grep -q "Verified using v1 scheme.*true"; then
            echo "::error::APK NO está firmado con v1 (jar) — Honor/Huawei/Xiaomi rechazarán"
            exit 1
          fi
          if ! echo "$OUT" | grep -q "Verified using v2 scheme.*true"; then
            echo "::error::APK NO está firmado con v2"
            exit 1
          fi
          # v3 es opcional según el dispositivo; lo logueamos pero no fallamos.
          SIZE_KB=$(du -k app/build/outputs/apk/release/argus-android.apk | cut -f1)
          echo "size_kb=$SIZE_KB" >> "$GITHUB_OUTPUT"
          echo "- APK final: ${SIZE_KB} KB · v1+v2 OK ✓" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact (per-commit, 30 day retention)
        uses: actions/upload-artifact@v4
        with:
          name: argus-android-release-${{ github.sha }}
          path: mobile/argus_android/app/build/outputs/apk/release/argus-android.apk
          retention-days: 30
          if-no-files-found: error

      # Solo publicar release en push a main (no en PRs ni dispatch a otra rama).
      # El release "android-latest" siempre apunta al último commit de main.
      - name: Publish to GitHub Release (rolling tag android-latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Argus Android — Last build (${{ github.sha }})"
          body: |
            APK Argus Android **firmado** compilado automáticamente desde el
            commit `${{ github.sha }}` de `main`.

            **Descarga directa**: el botón "Descargar APK" de
            https://asperss.onrender.com/descargar te trae acá automáticamente.

            Tamaño aproximado: ${{ steps.verify.outputs.size_kb }} KB.

            > Build release firmado con keystore self-signed propio
            > (item Android #15). La firma es **estable** entre builds, así que
            > la app puede auto-actualizarse sin pedir desinstalar.
          prerelease: true
          make_latest: false
          files: mobile/argus_android/app/build/outputs/apk/release/argus-android.apk
          fail_on_unmatched_files: true
