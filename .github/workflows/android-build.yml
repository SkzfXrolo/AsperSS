name: Android APK Build

# Item Android #12 — pipeline CI para compilar el APK debug en cada push
# que toque mobile/argus_android/. Sube el APK como artifact (devs) Y como
# GitHub Release rolling tag "android-latest" (usuarios finales) de modo
# que /descargar/android en Render redirija a una URL pública estable
# sin token ni redeploy.
#
# Se ejecuta:
#  - En push a main que cambia mobile/argus_android/** o este workflow
#  - En PR que toca esos paths (sin publicar release, solo artifact)
#  - Manualmente vía workflow_dispatch
#
# Output:
#  - argus-android-debug-<sha>.zip como artifact (válido 30 días)
#  - argus-android.apk en release "android-latest" (URL pública estable)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/argus_android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'mobile/argus_android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # gradle/actions/setup-gradle@v4 instala una versión específica de
      # Gradle (no usa la del runner, que puede ser Gradle 9.x e incompatible
      # con AGP 8.2.2) y maneja caché de dependencias automáticamente.
      # Esto reemplaza al "gradle wrapper" + actions/cache manual del workflow
      # anterior, que era frágil porque dependía del Gradle preinstalado.
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
          cache-read-only: false

      - name: Build debug APK
        id: build
        working-directory: mobile/argus_android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee build.log
          echo "log_path=mobile/argus_android/build.log" >> "$GITHUB_OUTPUT"

      # En caso de fallo, dump el log al GITHUB_STEP_SUMMARY (visible
      # públicamente en la UI del run sin necesidad de login). Truncamos
      # a las últimas 600 líneas para mantener el summary legible.
      - name: Dump build log on failure
        if: failure() && steps.build.outcome == 'failure'
        working-directory: mobile/argus_android
        run: |
          echo "## Build log (last 600 lines)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 600 build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure (always available)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.sha }}
          path: mobile/argus_android/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Locate APK and report size
        id: locate
        working-directory: mobile/argus_android
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No se encontró el APK"
            exit 1
          fi
          # Copia con nombre estable para release/asset.
          cp "$APK" app/build/outputs/apk/debug/argus-android.apk
          SIZE_KB=$(du -k "$APK" | cut -f1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=mobile/argus_android/app/build/outputs/apk/debug/argus-android.apk" >> "$GITHUB_OUTPUT"
          echo "size_kb=$SIZE_KB" >> "$GITHUB_OUTPUT"
          echo "## APK Build Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tamaño: ${SIZE_KB} KB" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact (per-commit, 30 day retention)
        uses: actions/upload-artifact@v4
        with:
          name: argus-android-debug-${{ github.sha }}
          path: mobile/argus_android/${{ steps.locate.outputs.apk }}
          retention-days: 30
          if-no-files-found: error

      # Solo publicar release en push a main (no en PRs ni dispatch a otra rama).
      # El release "android-latest" siempre apunta al último commit de main.
      - name: Publish to GitHub Release (rolling tag android-latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Argus Android — Last build (${{ github.sha }})"
          body: |
            APK Argus Android compilado automáticamente desde el commit
            `${{ github.sha }}` de `main`.

            **Descarga directa**: el botón "Descargar APK" de
            https://asperss.onrender.com/descargar te trae acá automáticamente.

            Tamaño aproximado: ${{ steps.locate.outputs.size_kb }} KB.

            > Build debug — sin firmar con keystore de release. Para
            > distribución masiva habría que firmarlo (item Android #15).
          prerelease: true
          make_latest: false
          files: mobile/argus_android/app/build/outputs/apk/debug/argus-android.apk
          fail_on_unmatched_files: true
