name: Android APK Build

# Item Android #12 — pipeline CI para compilar el APK debug en cada push
# que toque mobile/argus_android/. Sube el APK como artifact para que el
# staff lo descargue desde el run de GH Actions sin tener Android Studio.
#
# Se ejecuta:
#  - En push a main que cambia mobile/argus_android/** o este workflow
#  - En PR que toca esos paths
#  - Manualmente vía workflow_dispatch (botón "Run workflow" en GH)
#
# Output:
#  - app-debug.apk como artifact (válido 30 días)
#  - Log de gradle build con tamaño del APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/argus_android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'mobile/argus_android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/argus_android/**/*.gradle*', 'mobile/argus_android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate Gradle wrapper if missing
        working-directory: mobile/argus_android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
          fi

      - name: Build debug APK
        working-directory: mobile/argus_android
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon assembleDebug

      - name: Locate APK and report size
        id: locate
        working-directory: mobile/argus_android
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No se encontró el APK"
            exit 1
          fi
          SIZE_KB=$(du -k "$APK" | cut -f1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "size_kb=$SIZE_KB" >> "$GITHUB_OUTPUT"
          echo "## APK Build Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tamaño: ${SIZE_KB} KB" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-android-debug-${{ github.sha }}
          path: mobile/argus_android/${{ steps.locate.outputs.apk }}
          retention-days: 30
          if-no-files-found: error
