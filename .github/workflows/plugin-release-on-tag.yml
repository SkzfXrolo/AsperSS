name: Plugin Release On Tag

on:
  push:
    tags:
      - "plugin-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build tagged release
        working-directory: minecraft_plugin/argus-mc
        run: mvn -B -ntp clean package

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: minecraft_plugin/argus-mc/target/argus-mc-*.jar
          generate_release_notes: true
